                l.visible = true;
                l.opacity = 1.0;
                icon.innerText = 'visibility';
            } else if (visibilityMode === 1) {
                l.visible = true;
                l.opacity = 0.3;
                icon.innerText = 'opacity';
            } else {
                l.visible = false;
                icon.innerText = 'visibility_off';
            }
            
            document.getElementById('canvas-container').style.display = l.visible ? 'flex' : 'none';
            document.getElementById('canvas-container').style.opacity = l.opacity;
            renderLayersUI();
        }

        let gridMode = 0; // 0 = off, 1 = ortho, 2 = persp
        function toggleGrid() {
            gridMode = (gridMode + 1) % 3;
            const overlay = document.getElementById('grid-overlay');
            const icon = document.querySelector('#tool-grid span');
            
            overlay.className = 'grid-overlay'; // reset
            if (gridMode === 1) {
                overlay.classList.add('show-ortho');
                icon.innerText = 'grid_4x4';
                icon.style.color = '#007ACC';
            } else if (gridMode === 2) {
                overlay.classList.add('show-persp');
                icon.innerText = 'center_focus_strong';
                icon.style.color = '#007ACC';
            } else {
                icon.innerText = 'grid_off';
                icon.style.color = '#CCC';
            }
            
            const l = layers.find(x => x.type === 'grid');
            if (l && gridMode > 0) {
                l.visible = true;
                overlay.style.display = 'block';
                renderLayersUI();
            }
        }

        function toggleZenMode() {
            document.body.classList.toggle('zen-mode');
            setTimeout(onWindowResize, 50); // Ensure flexbox updates before resizing canvas
        }

        function showExportDialog() {
            document.getElementById('export-dialog').style.display = 'flex';
        }

        function exportImage(include3D) {
            document.getElementById('export-dialog').style.display = 'none';
            document.getElementById('loading-overlay').style.display = 'flex';
            
            setTimeout(() => {
                const finalCanvas = document.createElement('canvas');
                const cArea = document.querySelector('.canvas-area');
                finalCanvas.width = cArea.clientWidth;
                finalCanvas.height = cArea.clientHeight;
                const ctx = finalCanvas.getContext('2d');
                
                // Draw layers (bottom to top)
                for (let i = 0; i < layers.length; i++) {
                    const l = layers[i];
                    if (!l.visible) continue;
                    ctx.globalAlpha = l.opacity;
                    if (l.type === 'draw') {
                        ctx.drawImage(l.canvas, 0, 0);
                    } else if (l.type === 'mannequin' && include3D) {
                        renderer.render(scene, camera);
                        ctx.drawImage(renderer.domElement, 0, 0, finalCanvas.width, finalCanvas.height);
                    }
                }
                ctx.globalAlpha = 1.0;

                const dataUrl = finalCanvas.toDataURL('image/png');
                
                if (window.AndroidApp && window.AndroidApp.saveImageToGallery) {
                    window.AndroidApp.saveImageToGallery(dataUrl.split(',')[1]);
                } else {
                    const link = document.createElement('a');
                    link.download = 'export.png';
                    link.href = dataUrl;
                    link.click();
                }
                document.getElementById('loading-overlay').style.display = 'none';
            }, 100);
        }

        function clearCanvas() {
            if (activeLayerIndex >= 0) {
                const l = layers[activeLayerIndex];
                if (l.type === 'draw' && !l.locked) l.ctx.clearRect(0, 0, l.canvas.width, l.canvas.height);
            }
        }

        const interactionOverlay = document.getElementById('interaction-overlay');
        interactionOverlay.addEventListener('pointerdown', e => {
            if (e.button !== 0 && e.pointerType === 'mouse') return;
            if (activeLayerIndex < 0) return;
            const l = layers[activeLayerIndex];
            if (!l.visible || l.locked || l.type !== 'draw') return;

            isDrawing = true;
            const rect = interactionOverlay.getBoundingClientRect();
            drawX = e.clientX - rect.left;
            drawY = e.clientY - rect.top;
            drawP = getPressure(e);
            lastX = drawX;
            lastY = drawY;
        });

        interactionOverlay.addEventListener('pointermove', e => {
            if (!isDrawing) return;
            if (e.getCoalescedEvents) {
                for (let evt of e.getCoalescedEvents()) draw(evt);
            } else {
                draw(e);
            }
        });

        let strokeCount = 0;
        const stopDrawing = (e) => {
            if (isDrawing) {
                if (e) draw(e, true);
                strokeCount++;
                if (strokeCount % 2 === 0) {
                    saveSnapshot();
                }
            }
            isDrawing = false;
        };
        interactionOverlay.addEventListener('pointerup', stopDrawing);
        interactionOverlay.addEventListener('pointercancel', stopDrawing);
        interactionOverlay.addEventListener('pointerout', stopDrawing);

        function getPressure(e) {
            let p = e.pressure !== undefined ? e.pressure : 0.5;
            if (p === 0) p = 0.5;
            if (e.pointerType !== 'pen' && e.pointerType !== 'stylus') p = 1.0;
            return p;
        }

        function draw(e, isFinal = false) {
            if (activeLayerIndex < 0) return;
            const l = layers[activeLayerIndex];
            if (!l.visible || l.locked || l.type !== 'draw') return;
            const dCtx = l.ctx;

            const rect = interactionOverlay.getBoundingClientRect();
            const targetX = e.clientX - rect.left;
            const targetY = e.clientY - rect.top;
            const targetP = getPressure(e);
            
            // Smoothing/Stabilization
            let smoothVal = parseInt(document.getElementById('brush-smooth').value) / 100;
            let lerp = isFinal ? 1.0 : (1.0 - smoothVal);
            if (lerp < 0.05) lerp = 0.05;
            
            drawX += (targetX - drawX) * lerp;
            drawY += (targetY - drawY) * lerp;
            drawP += (targetP - drawP) * lerp;
            
            dCtx.lineCap = 'round';
            dCtx.lineJoin = 'round';
            dCtx.strokeStyle = brushColor;
            dCtx.fillStyle = brushColor;
            
            if (drawMode === 'eraser') {
                dCtx.globalCompositeOperation = 'destination-out';
                dCtx.globalAlpha = 1.0;
                dCtx.lineWidth = brushSize * 2;
                dCtx.beginPath(); dCtx.moveTo(lastX, lastY); dCtx.lineTo(drawX, drawY); dCtx.stroke();
            } else {
                dCtx.globalCompositeOperation = 'source-over';
                let preset = brushPresets[activeBrushPreset];
                let size = brushSize * preset.pressureCurve(drawP);
                preset.render(dCtx, drawX, drawY, lastX, lastY, size);
            }
            
            lastX = drawX;
            lastY = drawY;
        }
    </script>
</body>
